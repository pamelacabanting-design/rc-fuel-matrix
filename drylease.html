<style>/* Leaflet 1.9.4 (BSD-2) naka-embed para hindi umasa sa CDN */
/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,

.leaflet-tile-container,

}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;

.leaflet-top,

.leaflet-fade-anim .leaflet-popup {

	        transition: opacity 0.2s linear;
	}

.leaflet-bar {

.leaflet-oldie .leaflet-control-zoom,

.leaflet-div-icon {

/* Tooltip */

.leaflet-tooltip-bottom {

}
.leaflet-tooltip-top {

}
.leaflet-tooltip-bottom:before,

<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eaf0f4; --surface:#ffffff; --ink:#12263a; --muted:#587086; --line:#cfdbe4;
  --wet:#0b6e8a; --wet-soft:#dcf0f6; --dry:#a85a00; --dry-soft:#fbead3;
  --focus:#1a5fd0; --err:#a1261f;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1a25; --surface:#162736; --ink:#e6eef5; --muted:#93a9bb; --line:#2a4155;
    --wet:#5cc4e0; --wet-soft:#123646; --dry:#f0a959; --dry-soft:#3b2810;
    --focus:#7fb0ff; --err:#ff8c84; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1a25; --surface:#162736; --ink:#e6eef5; --muted:#93a9bb; --line:#2a4155;
  --wet:#5cc4e0; --wet-soft:#123646; --dry:#f0a959; --dry-soft:#3b2810;
  --focus:#7fb0ff; --err:#ff8c84; color-scheme:dark;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --surface:#162736; } }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
main{max-width:1080px;margin:0 auto;padding:20px 16px 48px}
h1{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;font-weight:600;
  font-size:1.65rem;line-height:1.15;margin:8px 0 4px;letter-spacing:-.01em}
.sub{margin:0 0 20px;color:var(--muted);font-size:.95rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg);padding:4px;border-radius:10px;margin-bottom:16px}
.seg button{font:inherit;font-weight:600;border:0;background:transparent;color:var(--muted);
  padding:11px 8px;border-radius:7px;cursor:pointer;min-height:44px}
.seg button[aria-pressed="true"].wet{background:var(--wet);color:#fff}
.seg button[aria-pressed="true"].dry{background:var(--dry);color:#fff}
.seg button:focus-visible,.swap:focus-visible,.clear:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.field{position:relative;margin-bottom:12px}
label{display:block;font-weight:600;font-size:.9rem;margin-bottom:5px}
.inwrap{position:relative}
input[type=text]{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);
  border:1.5px solid var(--line);border-radius:8px;padding:12px 40px 12px 12px;min-height:48px}
input[type=text]:focus{outline:3px solid var(--focus);outline-offset:0;border-color:var(--focus)}
.clear{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;
  background:transparent;color:var(--muted);font-size:1.3rem;cursor:pointer;display:none;border-radius:8px}
.field.has-val .clear{display:block}
.list{position:absolute;z-index:20;left:0;right:0;top:100%;margin:4px 0 0;padding:4px;list-style:none;
  background:var(--surface);border:1px solid var(--line);border-radius:8px;max-height:260px;overflow-y:auto;
  box-shadow:0 8px 24px rgba(10,30,50,.18);display:none}
.list.open{display:block}
.list li{padding:10px 10px;border-radius:6px;cursor:pointer}
.list li[aria-selected="true"],.list li:hover{background:var(--wet-soft)}
.list li.none{color:var(--muted);cursor:default}
.list li.none:hover{background:transparent}
.hint{font-size:.82rem;color:var(--muted);margin-top:4px}
.swaprow{display:flex;justify-content:center;margin:-2px 0 6px}
.swap{font:inherit;font-size:.9rem;font-weight:500;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:20px;padding:7px 16px;min-height:40px;cursor:pointer}
.layout{display:block}
#result{margin-top:18px;min-width:0}
@media (min-width:860px){
  .layout{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:24px;align-items:start}
  #result{margin-top:0}
  #autoMap{grid-column:2;margin-top:0}
}
.route{font-size:.95rem;color:var(--muted);margin:0 0 10px}
.route strong{color:var(--ink);font-weight:600}
.card{border-radius:10px;border:1.5px solid var(--line);background:var(--surface);overflow:hidden}
.card.wet{border-color:var(--wet)} .card.dry{border-color:var(--dry)}
.kmrow{display:flex;align-items:baseline;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.card.wet .kmrow{background:var(--wet-soft)} .card.dry .kmrow{background:var(--dry-soft)}
.kmrow span{font-weight:500}
.kmrow b{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",sans-serif;font-size:2rem;font-weight:600;font-variant-numeric:tabular-nums}
.kmrow small{font-size:1rem;font-weight:500;color:var(--muted);margin-left:4px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:12px 16px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{font-size:.82rem;font-weight:500;color:var(--muted);background:var(--surface)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.n{font-weight:600;font-size:1.1rem}
.msg{padding:14px 16px;border-radius:10px;background:var(--surface);border:1.5px solid var(--line)}
.msg.err{border-color:var(--err);color:var(--err)}
.msg button{font:inherit;font-weight:600;color:var(--focus);background:none;border:0;padding:6px 0 0;cursor:pointer;text-decoration:underline}
.empty{color:var(--muted);padding:6px 2px}
.status{margin:20px 0 0;font-size:.82rem;color:var(--muted)}.status.bad{color:var(--err)}
footer{margin-top:8px;color:var(--muted);font-size:.8rem}
@media (prefers-reduced-motion: no-preference){ .card{animation:in .18s ease-out} @keyframes in{from{opacity:.4}to{opacity:1}} }

.field{margin-bottom:12px}
.field.open{z-index:30}
.lblrow{display:flex;align-items:center;justify-content:space-between;min-height:28px;margin-bottom:5px}
.lblrow label{margin:0}
.rm{font:inherit;font-size:.85rem;font-weight:500;color:var(--err);background:none;border:0;padding:6px 4px;min-height:36px;cursor:pointer;text-decoration:underline}
.rm:focus-visible,.btn:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.btn{font:inherit;font-weight:600;font-size:.95rem;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 14px;min-height:44px;cursor:pointer}
.btn.primary{border-color:var(--ink)}
.btn.ghost{color:var(--muted);font-weight:500}
.totalcard{margin-top:18px}
.tot-title{font-weight:600;margin:0 0 8px}
.warn{margin:0 0 12px}
.legs{margin-top:16px}
#autoMap{margin-top:16px;max-width:640px;min-width:0}
.legs h2{font-size:1rem;font-weight:600;margin:0 0 8px}
.leg{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.leg.miss{border-color:var(--err)}
.lhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.lroute{font-weight:600;min-width:0;overflow-wrap:anywhere}
.lkm{white-space:nowrap;font-weight:600;font-variant-numeric:tabular-nums}
.lnum{font-size:.82rem;color:var(--muted);margin-bottom:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:.88rem;color:var(--muted)}
.chips b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.leg .err{color:var(--err);font-size:.9rem;margin-top:6px}
.copied{font-size:.85rem;color:var(--muted);align-self:center}

/* 3-column: Input | Total | Hati-hati ng biyahe (magkakatabi) */
@media (min-width:980px){
  main{max-width:1600px}
  .layout{display:grid;grid-template-columns:minmax(280px,340px) minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto 1fr;gap:20px;align-items:start}
  .layout > .panel{grid-row:1 / span 2}
  #result{display:contents}
  .restot{grid-column:2;grid-row:1;min-width:0}
  .legs{grid-column:3;grid-row:1 / span 2;margin-top:0;min-width:0}
  #result > .empty{grid-column:2 / 4;grid-row:1}
  #autoMap{grid-column:2;grid-row:2;margin-top:-10px;max-width:none}
}
.coordrow{margin-top:6px}
.coordrow .coord{font-size:14px;min-height:40px;padding:8px 12px;font-variant-numeric:tabular-nums}
.coordrow .coord.bad{border-color:var(--err)}
.coordrow .chint{font-size:.78rem;color:var(--muted);margin-top:3px;min-height:1em}
.coordrow .chint.bad{color:var(--err)}
.mapbtn{display:inline-block;text-decoration:none;color:var(--ink);border:1.5px solid var(--ink);border-radius:8px;padding:10px 14px;font-weight:600;font-size:.9rem;margin-top:10px;background:var(--surface)}
.mapbtn:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.mapnote{margin-top:10px;font-size:.85rem;color:var(--muted)}
.geo{margin-top:8px;font-size:.82rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.geo a{color:var(--focus);font-weight:600}
.geo .flag{color:var(--err);font-weight:600}
.tabs{display:flex;gap:6px;margin:0 0 16px;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-weight:600;border:0;background:transparent;color:var(--muted);padding:10px 16px;min-height:44px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--focus)}
.tabs button:focus-visible{outline:3px solid var(--focus);outline-offset:-3px}
[hidden]{display:none!important}
#tabMap textarea{width:100%;min-height:150px;font:inherit;font-size:15px;line-height:1.5;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;resize:vertical;font-variant-numeric:tabular-nums}
#tabMap textarea:focus{outline:3px solid var(--focus);border-color:var(--focus)}
.maphelp{font-size:.82rem;color:var(--muted);margin:6px 0 10px}
.mapframe{width:100%;aspect-ratio:2/1.5;height:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);display:block}
.mapcol{min-width:0}
.mtable{width:100%;border-collapse:collapse;margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:.9rem}
.mtable th,.mtable td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line)}
.mtable th{font-size:.75rem;color:var(--muted);font-weight:600}
.mtable td.n,.mtable th.n{text-align:right;font-variant-numeric:tabular-nums}
.mtable a{color:var(--focus);font-weight:600}
.mtable .nm{color:var(--muted)}
.mtot{margin-top:12px;display:flex;justify-content:space-between;align-items:baseline;background:var(--dry-soft);border:1px solid var(--dry);border-radius:10px;padding:12px 14px}
.mtot b{font-size:1.6rem}
#leafMap{width:100%;aspect-ratio:2/1.5;height:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);z-index:0}
.pin{background:var(--focus);color:#fff;border:2px solid #fff;border-radius:50%;font:600 12px/22px "IBM Plex Sans",system-ui,sans-serif;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.basetog{display:inline-flex;gap:0;margin-bottom:8px;border:1.5px solid var(--line);border-radius:8px;overflow:hidden}
.basetog button{font:inherit;font-size:.85rem;font-weight:600;border:0;background:var(--surface);color:var(--muted);padding:7px 14px;cursor:pointer;min-height:36px}
.basetog button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.pin-start{background:#fff;border:4px solid #202124;border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.pin-end span{display:block;width:26px;height:26px;background:#ea4335;border:2px solid #b3261e;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 1px 4px rgba(0,0,0,.5);position:relative}
.pin-end span::after{content:"";position:absolute;width:9px;height:9px;background:#7a1a14;border-radius:50%;top:6.5px;left:6.5px}
.rlabel{background:#fff;color:#202124;border-radius:5px;padding:3px 6px;font:12px/1.25 "IBM Plex Sans",system-ui,sans-serif;text-align:left;box-shadow:0 1px 4px rgba(0,0,0,.45);border:1px solid #dadce0;cursor:pointer;white-space:nowrap}
.rlabel.main{background:#1a1fd0;color:#fff;border-color:#1a1fd0}
.routeinfo{margin:8px 0 0;font-size:.9rem}
.routeinfo b{font-variant-numeric:tabular-nums}
.leasebadge{display:block;text-align:center;font-weight:600;color:#fff;padding:11px 8px;border-radius:10px;margin-bottom:16px}.leasebadge.wet{background:var(--wet)}.leasebadge.dry{background:var(--dry)}.h1tag{font-size:.55em;font-weight:600;padding:3px 10px;border-radius:999px;color:#fff;vertical-align:middle;margin-left:6px}.h1tag.wet{background:var(--wet)}.h1tag.dry{background:var(--dry)}
</style>
</head>
<body>
<main>
  <h1>Fuel Matrix <span class="h1tag dry">Dry lease</span></h1>
  <p class="sub">Ilagay ang mga stop ayon sa pagkakasunod-sunod ng biyahe.</p>

  <div id="tabFuel">
  <div class="layout">
  <section class="panel" aria-label="Biyahe">
    <div class="leasebadge dry">Dry lease</div>
    <div id="stops"></div>
    <div class="actions">
      <button type="button" class="btn primary" id="add">Add stop</button>
      <button type="button" class="btn ghost" id="reset">Ulitin</button>
    </div>
  </section>

  <div id="result" aria-live="polite"></div>
  <div id="autoMap" hidden>
    <p class="maphelp" id="autoMapNote" style="margin:0 0 8px"></p>
    <div class="basetog" id="mapTools"><button type="button" id="bSat" aria-pressed="true">Satellite</button><button type="button" id="bRoad" aria-pressed="false">Mapa</button></div>
    <div id="leafMap" role="img" aria-label="Mapa ng ruta"></div>
    <iframe class="mapframe" id="autoFrame" title="Mapa ng ruta" referrerpolicy="no-referrer-when-downgrade" hidden></iframe>
    <p class="routeinfo" id="routeInfo"></p>
    <p class="mapnote" id="mapWarn" hidden style="color:var(--err)"></p>
  </div>
  </div>
  </div>

  <p class="status" id="status" aria-live="polite"></p>
</main>

function parseCSV(text){
  const rows=[]; let row=[], cur="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c;
    } else if(c==='"') q=true;
    else if(c===","){ row.push(cur); cur=""; }
    else if(c==="\n"){ row.push(cur); rows.push(row); row=[]; cur=""; }
    else if(c==="\r"){}
    else cur+=c;
  }
  if(cur!==""||row.length){ row.push(cur); rows.push(row); }
  return rows;
}
function toNum(s){
  if(s==null) return NaN; s=String(s).replace(/,/g,"").trim();
  if(s==="") return NaN; const n=Number(s); return Number.isFinite(n)?n:NaN;
}
function dbFromRows(rows){
  const names=[], idx=new Map(), seen=new Set(), routes=[];
  const ix=n=>{ if(!idx.has(n)){ idx.set(n,names.length); names.push(n);} return idx.get(n); };
  for(let k=0;k<rows.length;k++){
    const r=rows[k]; if(!r) continue;
    const o=(r[2]||"").trim(), d=(r[3]||"").trim(); if(!o||!d) continue;
    const vals=[r[8],r[9],r[10],r[11],r[12],r[13],r[24],r[25],r[26],r[27],r[28],r[29]].map(toNum);
    if(vals.some(isNaN)) continue;
    const key=o+"|"+d; if(seen.has(key)) continue; seen.add(key);
    routes.push([ix(o),ix(d),...vals.map(v=>Math.round(v*10)/10)]);
  }
  return {n:names, r:routes};
}

async function tryUrl(url, label){
  let resp;
  try{
    const ctrl=new AbortController(); const to=setTimeout(()=>ctrl.abort(),25000);
    resp=await fetch(url,{cache:"no-store",signal:ctrl.signal}); clearTimeout(to);
  }catch(e){
    throw new Error(label+": hindi maabot o naka-block ("+(e&&e.name==="AbortError"?"time out":"network o CORS")+")");
  }
  if(!resp.ok) throw new Error(label+": HTTP "+resp.status);
  const rows=parseCSV(await resp.text());
  const db=dbFromRows(rows);
  if(db.r.length<100){
    const first=(rows[0]||[]).slice(0,4).map(x=>String(x).replace(/\s+/g," ").trim().slice(0,20)).join(" / ");
    throw new Error(label+": "+db.r.length+" route lang ang nabasa. Unang row: "+(first||"walang laman")+". Maaaring maling tab o nagbago ang column.");
  }
  return {db, lm: resp.headers.get('last-modified')};
}

const inPH = (la,ln) => la>=PH.latMin && la<=PH.latMax && ln>=PH.lngMin && ln<=PH.lngMax;
function fixOrder(a,b){ if(inPH(a,b)) return [a,b]; if(inPH(b,a)) return [b,a]; return null; }   // ayusin kung baligtad ang lat/long

function buildSheetCoords(rows){
  // J = index 9, K = index 10. Awtomatikong hinahanap ang column ng station name.
  const best={col:-1,hits:0};
  for(let c=0;c<9;c++){
    let h=0; for(let i=0;i<rows.length;i++){ const v=(rows[i][c]||"").trim().toLowerCase(); if(v && lowerIdx.has(v)) h++; }
    if(h>best.hits){ best.col=c; best.hits=h; }
  }
  if(best.col<0) return {map:new Map(),col:-1,n:0};
  const m=new Map(), conf=new Set(); let bad=0;
  for(const r of rows){
    const nm=(r[best.col]||"").trim(); if(!nm) continue;
    const a=toNum(r[9]), b=toNum(r[10]); if(isNaN(a)||isNaN(b)) continue;
    const c=fixOrder(a,b); if(!c){ bad++; continue; }   // labas ng Pilipinas = maling data, hindi gagamitin
    const key=normName(nm);
    if(conf.has(key)) continue;
    const old=m.get(key);
    if(old){ if(haversine(old,c)>0.3){ conf.add(key); m.delete(key); } continue; }   // magkaibang lokasyon, parehong pangalan: huwag mag-hula
    m.set(key,c);
  }
  return {map:m,col:best.col,n:m.size,conf,bad};
}

function parseLL(t){
  const m=String(t||"").match(/-?\d+(?:\.\d+)?/g);
  if(!m || m.length!==2) return null;
  const a=+m[0], b=+m[1];
  const f=fixOrder(a,b); if(f) return {c:f, swapped:(f[0]!==a), ph:true};

  return {c:[a,b], swapped:false, ph:false};
}

function haversine(a,b){
  const R=6371, r=x=>x*Math.PI/180;

  return 2*R*Math.asin(Math.sqrt(h));
}

function poolFor(k){

  // Sine-save lang kapag tapos na ang pag-type (blur/Enter), hindi bawat keystroke. Manual lang ang nase-save.
  coordIn.addEventListener("change",()=>{
    const nm = stops[k]!=null ? NAMES[stops[k]] : null; if(!nm) return;
    const v=coordIn.value.trim();
    if(!v){ saveCoord(nm,null); const sc=coordFor(nm); rc[k]=sc; coordIn.value=llTxt(sc); chint.textContent=sc?"Bumalik sa coordinates ng mm_clustering.":""; update(); return; }
    if(rc[k]){ saveCoord(nm,rc[k]); coordIn.value=llTxt(rc[k]); chint.textContent="Manual na coordinates, naka-save para sa "+nm+" sa browser na ito."; }
  });
  const input=f.querySelector("input"), list=f.querySelector("ul"), clearBtn=f.querySelector(".clear"), rm=f.querySelector(".rm");
  input.value=texts[k];
  let items=[], active=-1;

  function render(){
    const q=input.value.trim().toLowerCase();
    const words=q.split(/\s+/).filter(Boolean);
    items=poolFor(k).filter(i=>{const nm=NAMES[i].toLowerCase(); return words.every(w=>nm.includes(w));});
    if(q) items.sort((a,b)=>{const pa=NAMES[a].toLowerCase().startsWith(q)?0:1, pb=NAMES[b].toLowerCase().startsWith(q)?0:1; return pa-pb||byName(a,b);});
    list.innerHTML="";
    if(!items.length){ const li=document.createElement("li"); li.className="none"; li.textContent="Walang tugma"; list.appendChild(li); }
    items.slice(0,60).forEach(i=>{
      const li=document.createElement("li"); li.setAttribute("role","option"); li.textContent=NAMES[i]; li.dataset.i=i;
      li.addEventListener("mousedown",e=>{e.preventDefault(); pick(i);});
      li.addEventListener("touchend",e=>{e.preventDefault(); pick(i);});
      list.appendChild(li);
    });
    if(items.length>60){ const li=document.createElement("li"); li.className="none"; li.textContent="… "+(items.length-60)+" pa. Mag-type para paliitin."; list.appendChild(li); }
    active=-1;
  }
  function open(){ render(); list.classList.add("open"); f.classList.add("open"); input.setAttribute("aria-expanded","true"); }
  function close(){ list.classList.remove("open"); f.classList.remove("open"); input.setAttribute("aria-expanded","false"); }
  function pick(i){ input.value=NAMES[i]; texts[k]=NAMES[i]; stops[k]=i; f.classList.add("has-val"); close(); applyStationCoord(); update(); }
  function setActive(nn){
    const lis=[...list.querySelectorAll("li[role=option]")]; if(!lis.length) return;
    active=(nn+lis.length)%lis.length;
    lis.forEach((li,x)=>li.setAttribute("aria-selected",x===active));
    lis[active].scrollIntoView({block:"nearest"});
  }
  input.addEventListener("focus",()=>{ input.select(); open(); });
  input.addEventListener("input",()=>{
    texts[k]=input.value; const m=lowerIdx.get(input.value.trim().toLowerCase());
    stops[k]=(m===undefined)?null:m; f.classList.toggle("has-val",!!input.value); applyStationCoord(); open(); update();
  });
  input.addEventListener("blur",()=>setTimeout(close,120));
  input.addEventListener("keydown",e=>{
    if(e.key==="ArrowDown"){e.preventDefault(); if(!list.classList.contains("open")) open(); setActive(active+1);}
    else if(e.key==="ArrowUp"){e.preventDefault(); setActive(active-1);}
    else if(e.key==="Enter"){ const lis=list.querySelectorAll("li[role=option]"); const t=active>=0?lis[active]:(lis.length===1?lis[0]:null); if(t){e.preventDefault(); pick(+t.dataset.i);} }
    else if(e.key==="Escape"){ close(); }
  });
  clearBtn.addEventListener("click",()=>{ input.value=""; texts[k]=""; stops[k]=null; prevStop=null; rc[k]=null; coordIn.value=""; chint.textContent=""; f.classList.remove("has-val"); update(); input.focus(); });
  if(rm) rm.addEventListener("click",()=>{ stops.splice(k,1); texts.splice(k,1); rc.splice(k,1); buildRows(); });
  return f;
}

$("add").onclick=()=>{ stops.push(null); texts.push(""); rc.push(null); buildRows(stops.length-1); };
$("reset").onclick=()=>{ stops=[null,null]; texts=["",""]; rc=[null,null]; buildRows(); };

let lastSummary="";
function geoLine(L){
  const A=rc[L.n-1], B=rc[L.n];
  if(!A||!B||!L.r) return "";
  const sl=haversine(A,B), mk=L.r[2];
  let flag="";
  if(sl>0.5 && mk<sl*0.95) flag='<span class="flag">Mas maikli ang matrix km kaysa straight-line. I-check ang coordinates o ang matrix.</span>';
  else if(sl>0.5 && mk>sl*2.5) flag='<span class="flag">Mas mahaba nang malaki ang matrix km kaysa straight-line. I-check kung tama ang coordinates.</span>';
  return '<div class="geo">'+
    '<a target="_blank" rel="noopener" href="'+esc(dirUrl([A,B]))+'">Tingnan ang leg na ito sa Google Maps</a>'+flag+'</div>';
}
function update(){ updateCore(); updateAutoMap(); }
const ESRI="https://server.arcgisonline.com/ArcGIS/rest/services/";
const BASES={
  sat:[ [ {u:ESRI+"World_Imagery/MapServer/tile/{z}/{y}/{x}",o:{maxZoom:19,attribution:"Esri, Maxar, Earthstar Geographics"}},
          {u:ESRI+"Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}",o:{maxZoom:19}},
          {u:ESRI+"Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",o:{maxZoom:19}} ] ],
  road:[ [ {u:"https://tile.openstreetmap.org/{z}/{x}/{y}.png",o:{maxZoom:19,attribution:"© OpenStreetMap"}} ],
         [ {u:"https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png",o:{maxZoom:19,subdomains:"abcd",attribution:"© OpenStreetMap © CARTO"}} ],
         [ {u:ESRI+"World_Street_Map/MapServer/tile/{z}/{y}/{x}",o:{maxZoom:19,attribution:"Esri"}} ] ]
};
let baseGroup=null, baseMode="sat";
function useBase(mode,i){
  if(baseGroup){ lmap.removeLayer(baseGroup); baseGroup=null; }
  const list=BASES[mode];
  if(i>=list.length){
    if(mode==="sat"){ return useBase("road",0); }
    $("mapWarn").textContent="Hindi ma-load ang mga tile ng mapa. Malamang naka-block sa network. Ang ruta at mga pin ay nakadrowing pa rin, pero walang background na mapa.";
    $("mapWarn").hidden=false; return;
  }
  baseMode=mode; $("mapWarn").hidden=true;
  $("bSat").setAttribute("aria-pressed",mode==="sat"); $("bRoad").setAttribute("aria-pressed",mode==="road");
  let ok=false, err=0;
  baseGroup=L.layerGroup(list[i].map((t,x)=>{
    const lyr=L.tileLayer(t.u,t.o);
    if(x===0){ lyr.on("tileload",()=>{ok=true;}); lyr.on("tileerror",()=>{ if(!ok && ++err>=3){ err=-999; useBase(mode,i+1); } }); }
    return lyr;
  })).addTo(lmap);
  baseGroup.eachLayer(l=>{ if(l.bringToBack) l.bringToBack(); });
}
function fmtDur(sec){
  let h=Math.floor(sec/3600), m=Math.round((sec%3600)/60);
  if(m===60){ h++; m=0; }
  return h?(h+" hr "+m+" min"):(m+" min");
}
// Land-only km: tinatanggal ang mga step na mode=ferry (tawid-dagat / barko) sa distance ng OSRM.
function splitLandSea(rt){
  let sea=0; const segs=[];
  (rt.legs||[]).forEach(lg=>(lg.steps||[]).forEach(st=>{
    if(st.mode==="ferry"){ sea+=st.distance||0; if(st.geometry&&st.geometry.coordinates) segs.push(st.geometry.coordinates.map(c=>[c[1],c[0]])); }
  }));
  rt.seaM=Math.min(sea,rt.distance); rt.landM=Math.max(0,rt.distance-rt.seaM); rt.ferrySegs=segs;
  return rt;
}
let matrixKm=0;   // total km ng matrix (land lang na) kapag kumpleto ang lahat ng leg; ito ang ipinapakita sa mapa
let autoSrc="", lmap=null, llayer=null, routeSeq=0, routeKey="", curRoutes=[], curSel=0, curPts=[];
function showFrame(on){ $("autoFrame").hidden=!on; $("leafMap").hidden=on; $("mapTools").hidden=on; }
function pinIcon(i,n){
  if(i===0) return L.divIcon({className:"pin-start",html:"",iconSize:[18,18],iconAnchor:[9,9]});
  if(i===n-1) return L.divIcon({className:"pin-end",html:"<span></span>",iconSize:[26,36],iconAnchor:[13,34]});
  return L.divIcon({className:"pin",html:String(i),iconSize:[26,26],iconAnchor:[13,13]});
}
function drawSel(){
  llayer.clearLayers();
  const order=curRoutes.map((_,i)=>i).filter(i=>i!==curSel).concat([curSel]);
  let altN=0;
  order.forEach(i=>{
    const rt=curRoutes[i], main=(i===curSel);
    const ll2=rt.geometry.coordinates.map(c=>[c[1],c[0]]);
    L.polyline(ll2,{color:"#ffffff",weight:main?10:8,opacity:.9}).addTo(llayer);
    const line=L.polyline(ll2,{color:main?"#2f1fd8":"#8fa3ff",weight:main?6:5,opacity:1}).addTo(llayer);
    if(!main) line.on("click",()=>{ curSel=i; drawSel(); showInfo(); });
    if(main) (rt.ferrySegs||[]).forEach(sg=>L.polyline(sg,{color:"#ff9800",weight:6,opacity:1,dashArray:"4 10"}).addTo(llayer));
    const f=main?0.5:(altN++%2?0.7:0.3), pt=ll2[Math.min(ll2.length-1,Math.floor(ll2.length*f))];
    const lab=L.marker(pt,{icon:L.divIcon({className:"rlabel"+(main?" main":""),html:"<b>"+fmtDur(rt.duration)+"</b><br>"+fmt((main&&matrixKm)?matrixKm:rt.landM/1000)+" km"+(rt.seaM>50?"<br><small>land only</small>":""),iconSize:rt.seaM>50?[84,50]:[84,38],iconAnchor:rt.seaM>50?[42,25]:[42,19]}),zIndexOffset:main?500:100}).addTo(llayer);
    if(!main) lab.on("click",()=>{ curSel=i; drawSel(); showInfo(); });
  });
  curPts.forEach((p,i)=>{
    L.marker(p.c,{icon:pinIcon(i,curPts.length),title:p.name||"",zIndexOffset:1000}).bindTooltip(p.name||"",{direction:"top",offset:[0,i===curPts.length-1?-30:-10]}).addTo(llayer);
  });
}
function showInfo(){
  const rt=curRoutes[curSel]; let sl=0; for(let i=0;i<curPts.length-1;i++) sl+=haversine(curPts[i].c,curPts[i+1].c);
  const sea=rt.seaM||0;
  $("routeInfo").innerHTML = sea>50
    ? "Km distance by land: <b>"+fmt(matrixKm||rt.landM/1000)+" KM</b><br><span style=\"color:#e65100;font-weight:600\">Orange dashed line:</span> By Sea &ndash; excluded from the total kilometer distance calculation."
    : "";
}
function drawRoute(pts){
  const info=$("routeInfo");
  if(GMAPS_KEY){
    showFrame(true); info.textContent="";
    const o=ll(pts[0].c), d=ll(pts[pts.length-1].c), w=pts.slice(1,-1).map(p=>ll(p.c)).join("|");
    const src="https://www.google.com/maps/embed/v1/directions?key="+encodeURIComponent(GMAPS_KEY)+"&origin="+encodeURIComponent(o)+"&destination="+encodeURIComponent(d)+(w?"&waypoints="+encodeURIComponent(w):"")+"&mode=driving&maptype=satellite";
    if(src!==autoSrc){ $("autoFrame").src=src; autoSrc=src; }
    return;
  }
  showFrame(false);
  if(typeof L==="undefined"){ info.textContent="Hindi gumana ang mapa sa browser na ito. Gamitin ang button na Google Maps."; return; }
  if(!lmap){
    lmap=L.map("leafMap",{scrollWheelZoom:false});
    llayer=L.layerGroup().addTo(lmap);
    useBase("sat",0);
    $("bSat").onclick=()=>useBase("sat",0); $("bRoad").onclick=()=>useBase("road",0);
  }
  lmap.invalidateSize();
  const key=pts.map(p=>ll(p.c)).join(";");
  if(key===routeKey) return;
  routeKey=key; const my=++routeSeq;
  curPts=pts; curRoutes=[];
  llayer.clearLayers();
  const dash=L.polyline(pts.map(p=>p.c),{color:"#ffffff",weight:3,dashArray:"6 8"}).addTo(llayer);
  lmap.fitBounds(dash.getBounds(),{padding:[40,40]});
  let sl=0; for(let i=0;i<pts.length-1;i++) sl+=haversine(pts[i].c,pts[i+1].c);
  info.innerHTML="Kumukuha ng ruta sa kalsada... Straight-line: <b>"+fmt(sl)+" km</b>";
  const coords=pts.map(p=>p.c[1]+","+p.c[0]).join(";");
  fetch("https://router.project-osrm.org/route/v1/driving/"+coords+"?overview=full&geometries=geojson&steps=true&alternatives=true")
    .then(r=>r.json()).then(j=>{
      if(my!==routeSeq) return;
      if(!j.routes||!j.routes.length) throw new Error("walang ruta");
      curRoutes=j.routes.slice(0,3).map(splitLandSea); curSel=0;
      drawSel(); showInfo();
      const all=L.latLngBounds([]); curRoutes.forEach(r=>r.geometry.coordinates.forEach(c=>all.extend([c[1],c[0]])));
      lmap.fitBounds(all,{padding:[40,40]});
    }).catch(()=>{
      if(my!==routeSeq) return;
      llayer.clearLayers(); curPts=pts;
      L.polyline(pts.map(p=>p.c),{color:"#2f1fd8",weight:4,dashArray:"6 8"}).addTo(llayer);
      pts.forEach((p,i)=>L.marker(p.c,{icon:pinIcon(i,pts.length),zIndexOffset:1000}).addTo(llayer));
      info.innerHTML="Hindi makuha ang ruta sa kalsada, kaya straight-line ang ipinapakita: <b>"+fmt(sl)+" km</b>.";
    });
}
function updateAutoMap(){
  const box=$("autoMap"), note=$("autoMapNote"), pts=[], miss=[];
  const allPicked = stops.length>=2 && stops.every(st=>st!=null);
  if(!allPicked){ box.hidden=true; return; }
  stops.forEach((st,k)=>{ if(rc[k]) pts.push({c:rc[k],name:NAMES[st]}); else miss.push(NAMES[st]); });
  box.hidden=false;
  if(pts.length<2){
    $("leafMap").hidden=true; $("autoFrame").hidden=true; $("mapTools").hidden=true; $("routeInfo").textContent="";
    note.textContent="Hindi mailabas ang mapa: walang coordinates ang "+miss.join(", ")+". "+(SHEETC.size?"Wala sila sa mm_clustering. Ilagay ang Lat, Long nang mano-mano sa ilalim ng stop.":"Hindi pa na-load ang mm_clustering (coords.csv). I-run ang Sync Google Sheet, o ilagay ang Lat, Long nang mano-mano.");
    return;
  }
  note.textContent = miss.length ? "Walang coordinates ang: "+miss.join(", ")+". Hindi sila kasama sa mapa." : "";
  drawRoute(pts);
}
function updateCore(){
  const res=$("result");
  const vehicles = lease==="wet" ? WET_V : DRY_V;
  const cls = lease==="wet" ? "wet" : "dry";
  const legs=[];
  for(let k=0;k<stops.length-1;k++){
    const a=stops[k], b=stops[k+1];
    if(a==null || b==null) continue;
    legs.push({n:k+1,a,b,r:pair.get(a+"|"+b), rev:pair.get(b+"|"+a)});
  }
  if(!legs.length){
    res.innerHTML='<p class="empty">Pumili ng origin at destination para lumabas ang resulta.</p>'; lastSummary=""; return;
  }
  let km=0, tot=vehicles.map(()=>0), found=0;
  for(const L of legs){
    if(!L.r) continue;
    found++; km+=L.r[2];
    const vals = lease==="wet" ? L.r.slice(3,8) : L.r.slice(8,14);
    vals.forEach((v,x)=>tot[x]+=v);
  }
  const missing = legs.length-found;
  matrixKm = (missing===0 && !stops.some(x=>x==null)) ? km : 0;
  const legCountTxt = legs.length+" leg";
  const pendingStops = stops.some(s=>s==null);

  let html='<div class="restot">';
  if(missing>0) html+='<div class="msg err warn"><strong>Kulang ang data.</strong> '+missing+' sa '+legs.length+' leg ang walang data sa matrix, kaya hindi kasama sa total.</div>';
  else if(pendingStops) html+='<div class="msg warn">May stop na hindi pa napipili. Ang total ay para sa mga leg na kumpleto lang.</div>';

  const rows=vehicles.map((v,x)=>'<tr><td>'+esc(v)+'</td><td class="n">'+fmt(tot[x])+' L</td></tr>').join("");
  html+='<div class="card '+cls+' totalcard" style="margin-top:0">'+
    '<div class="kmrow"><span>Distance ('+found+' leg'+')</span><div><b>'+fmt(km)+'</b><small>km</small></div></div>'+
    '<table><thead><tr><th>Fleet size</th><th class="n">Allocated diesel ('+(lease==="wet"?"wet lease":"dry lease")+')</th></tr></thead><tbody>'+rows+'</tbody></table></div>';

  html+='<div class="actions" style="margin-top:10px"><button type="button" class="btn" id="copy">Kopyahin ang buod</button><span class="copied" id="copied"></span></div>';

  html+='</div>';
  html+='<section class="legs"><h2>Per leg</h2>';
  for(const L of legs){
    const route='<span class="lroute">'+esc(NAMES[L.a])+' → '+esc(NAMES[L.b])+'</span>';
    if(L.r){
      const vals = lease==="wet" ? L.r.slice(3,8) : L.r.slice(8,14);
      html+='<div class="leg"><div class="lnum">Leg '+L.n+'</div><div class="lhead">'+route+'<span class="lkm">'+L.r[2]+' km</span></div>'+
        '<div class="chips">'+vehicles.map((v,x)=>'<span>'+esc(v)+' <b>'+vals[x]+' L</b></span>').join("")+'</div>'+geoLine(L)+'</div>';
    } else {
      html+='<div class="leg miss"><div class="lnum">Leg '+L.n+'</div><div class="lhead">'+route+'</div>'+
        '<div class="err">Walang data para sa leg na ito.'+(L.rev?' Mayroong data para sa baligtad na route ('+esc(NAMES[L.b])+' papuntang '+esc(NAMES[L.a])+').':'')+'</div></div>';
    }
  }
  html+='</section>';
  res.innerHTML=html;

  const lines=[(lease==="wet"?"Wet lease":"Dry lease")+" - "+legs.map(L=>NAMES[L.a]).concat([NAMES[legs[legs.length-1].b]]).join(" > ")];
  lines.push("Distance: "+fmt(km)+" km");
  vehicles.forEach((v,x)=>lines.push(v+": "+fmt(tot[x])+" L"));
  if(missing>0) lines.push("Paalala: "+missing+" leg ang walang data at hindi kasama sa total.");
  lastSummary=lines.join("\n");
  $("copy").onclick=copySummary;
}

function copySummary(){
  const note=$("copied");
  const done=ok=>{ note.textContent = ok ? "Nakopya na." : "Hindi nakopya. Piliin at kopyahin nang mano-mano."; };
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(lastSummary).then(()=>done(true),()=>done(false)); return; }
  }catch(e){}
  try{
    const ta=document.createElement("textarea"); ta.value=lastSummary; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select(); const ok=document.execCommand("copy"); document.body.removeChild(ta); done(ok);
  }catch(e){ done(false); }
}


function embedUrl(pts){
  const f=pts.map(p=>p.c[0]+","+p.c[1]);
  return "https://maps.google.com/maps?output=embed&saddr="+encodeURIComponent(f[0])+"&daddr="+f.slice(1).map(encodeURIComponent).join("+to:");
}

loadLive();
